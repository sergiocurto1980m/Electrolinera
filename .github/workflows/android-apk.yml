name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-apk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_DEPLOY_HOOK_URL: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Dependencias
        run: npm ci

      - name: Comprobar variables del build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "Falta la variable VITE_SUPABASE_URL"; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Falta la variable VITE_SUPABASE_ANON_KEY"; exit 1; }
          test -n "$VITE_APP_URL" || { echo "Falta la variable VITE_APP_URL"; exit 1; }

      - name: Build web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Preparar keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Falta el secreto ANDROID_KEYSTORE_BASE64"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build APK firmado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION_NAME="$(node -p "require('./package.json').version")+${GITHUB_RUN_NUMBER}"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"

          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease --no-daemon \
            -PappVersionName="$VERSION_NAME" \
            -PappVersionCode="${GITHUB_RUN_NUMBER}"

      - name: Preparar assets del release
        run: |
          mkdir -p release
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          test -n "$APK" || { echo "No se encontró el APK de release"; exit 1; }
          cp "$APK" release/electrolinera.apk

          node -e "
            const fs = require('fs');
            const size = fs.statSync('release/electrolinera.apk').size;
            fs.writeFileSync('release/latest.json', JSON.stringify({
              version: process.env.VERSION_NAME,
              build: Number(process.env.GITHUB_RUN_NUMBER),
              date: new Date().toISOString(),
              size
            }, null, 2));
          "

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view apk-latest >/dev/null 2>&1; then
            gh release edit apk-latest --latest
          else
            gh release create apk-latest \
              --title "Android · última versión" \
              --notes "APK generado automáticamente desde main." \
              --latest
          fi

          gh release upload apk-latest \
            release/electrolinera.apk release/latest.json --clobber

          gh release edit apk-latest --latest \
            --notes "APK generado desde main en el commit ${GITHUB_SHA}."

      - name: Reconstruir Cloudflare Pages
        if: env.CLOUDFLARE_DEPLOY_HOOK_URL != ''
        run: curl -fsS -X POST "$CLOUDFLARE_DEPLOY_HOOK_URL"
